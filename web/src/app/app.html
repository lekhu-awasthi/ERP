<!--
  Phase 34a -- WCAG 2.1 **2.4.1 Bypass Blocks (Level A)**.

  Phase 33 put a header on every in-organization screen, which means every keyboard user now tabs
  through the History button and the search box before reaching the page they navigated to -- on
  every single navigation. Phase 34b put a left nav in front of that, which makes the skip link
  load-bearing rather than merely correct: without it, Tab now crosses ~60 nav rows before reaching
  the page. It is visually hidden until focused (`.visually-hidden-focusable`), so it costs the
  layout nothing and is the first thing Tab reaches, which is the only position that makes it useful.
-->
<a class="skip-link visually-hidden-focusable" href="#main-content">Skip to main content</a>

<!--
  Phase 34c (NFR-5.2), 34b's carried item #5. The chrome renders only inside an organization, but
  until now it was *imported* unconditionally, so all four components and their transitive imports
  were in the initial bundle — downloaded and parsed by every visitor to the login and registration
  screens, who can never see any of it. `@defer (when …)` moves them into their own lazy chunk that
  is fetched on the first navigation into an organization. Measured in phase-34c-status.md
  Decision D.

  `@prefetch on idle` is what keeps this from trading one cost for another: the chunk is fetched
  during the browser's idle time after the login screen settles, so by the time someone has typed a
  password it is already there and the chrome paints with the first in-organization route.
-->
@defer (when organizationId() !== null; prefetch on idle) {
  @if (organizationId(); as orgId) {
    <!-- Phase 33: the platform chrome. Phase 34b: the left nav, Create New flyout, company switcher
         and global date filter that phase 33 deferred by name (its carried item #5).

         The rail is `position: fixed`, and the header and `<main>` are inset by its width, so the
         130 page templates below are untouched: every one of them opens with the same
         `<div class="container py-5">`, and a centred container simply re-centres inside a narrower
         main. See phase-34b-status.md Decision A -- the choice was never "re-layout 130 pages or
         overlay them", because the uniformity of that wrapper made a third option free. -->
    <app-left-nav [organizationId]="orgId" />

    <header class="platform-bar border-bottom bg-white">
      <div class="d-flex align-items-center gap-2 px-3 py-2">
        <app-history-menu />
        <search class="flex-grow-1" style="max-width: 40rem;">
          <app-global-search [organizationId]="orgId" />
        </search>
        <app-date-range-picker />
      </div>
    </header>
  }
}

<!--
  `tabindex="-1"` is what makes the skip link actually move focus: without it the browser scrolls to
  the target and leaves focus on the link, so the next Tab goes straight back into the header.
-->
<main id="main-content" class="shell" [class.shell-with-nav]="organizationId() !== null" tabindex="-1">
  <router-outlet />
</main>
