<section class="auth-page">
  <h1>Verify your email</h1>
  <p>Enter the 6-digit code we sent to your email address.</p>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <label>
      Email
      <input type="email" formControlName="email" autocomplete="email" />
    </label>

    <label>
      Verification code
      <input type="text" formControlName="code" inputmode="numeric" maxlength="6" autocomplete="one-time-code" />
    </label>

    @if (errorMessage()) {
      <p class="error" role="alert">{{ errorMessage() }}</p>
    }

    @if (infoMessage()) {
      <p class="info" role="status">{{ infoMessage() }}</p>
    }

    <button type="submit" [disabled]="submitting()">
      {{ submitting() ? 'Verifying...' : 'Verify email' }}
    </button>

    <button type="button" [disabled]="resending()" (click)="resendCode()">
      {{ resending() ? 'Sending...' : 'Resend code' }}
    </button>
  </form>

  <p><a routerLink="/login">Back to login</a></p>
</section>
