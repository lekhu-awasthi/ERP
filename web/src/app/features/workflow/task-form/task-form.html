<form [formGroup]="form" (ngSubmit)="submit()" class="card border-0 bg-light-subtle border mb-3">
  <div class="card-body p-3">
    <app-status-banner [message]="errorMessage()" spacing="mb-3" />

    <div class="row g-3">
      <div class="col-12 col-sm-6">
        <label class="form-label small fw-semibold" [for]="idPrefix() + '-title'">Title</label>
        <input [id]="idPrefix() + '-title'" type="text" class="form-control form-control-sm" formControlName="title" />
      </div>
      <div class="col-6 col-sm-3">
        <label class="form-label small fw-semibold" [for]="idPrefix() + '-type'">Type</label>
        <select [id]="idPrefix() + '-type'" class="form-select form-select-sm" formControlName="taskTypeId">
          <option value="" disabled>Select...</option>
          @for (type of taskTypes(); track type.id) {
            <option [value]="type.id">{{ type.name }}</option>
          }
        </select>
      </div>
      <div class="col-6 col-sm-3">
        <label class="form-label small fw-semibold" [for]="idPrefix() + '-priority'">Priority</label>
        <select [id]="idPrefix() + '-priority'" class="form-select form-select-sm" formControlName="priority">
          <option value="Normal">Normal</option>
          <option value="Urgent">Urgent</option>
        </select>
      </div>
      <div class="col-12">
        <label class="form-label small fw-semibold" [for]="idPrefix() + '-description'">Description</label>
        <textarea [id]="idPrefix() + '-description'" class="form-control form-control-sm" formControlName="description" rows="2"></textarea>
      </div>
      <div class="col-6 col-sm-4">
        <label class="form-label small fw-semibold" [for]="idPrefix() + '-due-date'">Due Date</label>
        <app-bs-date-input [inputId]="idPrefix() + '-due-date'" [inputClass]="'form-control form-control-sm'" formControlName="dueDate" />
      </div>
      <div class="col-6 col-sm-5">
        <label class="form-label small fw-semibold" [for]="idPrefix() + '-assigned-to'">Assigned To</label>
        <select [id]="idPrefix() + '-assigned-to'" class="form-select form-select-sm" formControlName="assignedToUserId">
          <option value="">Unassigned</option>
          @for (member of members(); track member.userId) {
            <option [value]="member.userId">{{ member.fullName }}</option>
          }
        </select>
      </div>
      <div class="col-12 col-sm-3 form-check pt-4 ps-4">
        <input type="checkbox" class="form-check-input" [id]="idPrefix() + '-is-private'" formControlName="isPrivate" />
        <label class="form-check-label small" [for]="idPrefix() + '-is-private'">Private</label>
      </div>
      <div class="col-12 d-flex gap-2">
        <button type="submit" class="btn btn-primary btn-sm fw-bold" [disabled]="saving()">
          @if (saving()) {
            <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
          } @else if (isEdit()) {
            Save Task
          } @else {
            Create Task
          }
        </button>
        <button type="button" class="btn btn-outline-secondary btn-sm" (click)="cancel()">Cancel</button>
      </div>
    </div>
  </div>
</form>
