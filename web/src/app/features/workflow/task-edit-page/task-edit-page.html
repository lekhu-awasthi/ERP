<div class="container py-4">
  <div class="d-flex align-items-center gap-3 mb-3 flex-wrap">
    <a class="btn btn-link px-0" [routerLink]="['/organizations', organizationId, 'workflow', 'tasks', taskId]">
      <i aria-hidden="true" class="bi bi-arrow-left"></i> Task
    </a>
    <h1 class="h4 fw-bold mb-0 text-dark">Edit task</h1>
  </div>

  <app-status-banner [message]="errorMessage()" />

  @if (loading()) {
    <div class="text-center py-5">
      <div class="spinner-border text-primary mb-3" role="status"></div>
      <p class="text-muted mb-0">Loading task...</p>
    </div>
  } @else if (task(); as row) {
    <app-task-form
      [organizationId]="organizationId"
      [task]="row"
      idPrefix="task-edit"
      (saved)="back()"
      (cancelled)="back()"
    />
  }
</div>
