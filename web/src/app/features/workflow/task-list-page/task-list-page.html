<div class="container py-5">
  <div class="d-flex align-items-center gap-3 mb-4 flex-wrap">
    <h1 class="h4 fw-bold mb-0 text-dark">Tasks</h1>
    <p class="text-muted small mb-0">Every task in this organization, whatever it is attached to.</p>
  </div>

  <div class="card border-0 shadow-sm">
    <div class="card-body">
      <!-- No parentType/parentId: the unscoped list. See TaskListPage for the live finding that
           this is one list rather than a filtered view of many. -->
      <app-task-list [organizationId]="organizationId" />
    </div>
  </div>
</div>
