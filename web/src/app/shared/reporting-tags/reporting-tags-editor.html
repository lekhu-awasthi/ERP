<div class="card border-0 shadow-sm mb-4">
  <div class="card-body p-4">
    <div class="d-flex justify-content-between align-items-center mb-2">
      <h6 class="fw-bold text-dark mb-0">Reporting Tags</h6>
      @if (editable() && !editing()) {
        <button type="button" class="btn btn-outline-primary btn-sm" (click)="startEditing()">
          <i class="bi bi-pencil"></i> Add/Edit
        </button>
      }
    </div>

    @if (errorMessage()) {
      <div class="alert alert-danger py-2 small mb-2">{{ errorMessage() }}</div>
    }

    @if (editing()) {
      <select class="form-select" multiple size="5" (change)="onSelectionChange($event)">
        @for (option of allOptions(); track option.id) {
          <option [value]="option.id" [selected]="selectedIds().includes(option.id)">{{ option.name }}</option>
        }
      </select>
      <div class="d-flex gap-2 mt-2">
        <button type="button" class="btn btn-primary btn-sm fw-bold" [disabled]="saving()" (click)="save()">
          @if (saving()) {
            <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
          } @else {
            Save
          }
        </button>
        <button type="button" class="btn btn-outline-secondary btn-sm fw-bold" [disabled]="saving()" (click)="cancelEditing()">
          Cancel
        </button>
      </div>
    } @else if (tags().length === 0) {
      <p class="text-muted small mb-0">No reporting tags</p>
    } @else {
      <div class="d-flex flex-wrap gap-2">
        @for (tag of tags(); track tag.tagOptionId) {
          <span class="badge bg-secondary-subtle text-secondary">{{ tag.categoryName }}: {{ tag.tagOptionName }}</span>
        }
      </div>
    }
  </div>
</div>
