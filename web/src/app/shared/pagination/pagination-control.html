<div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mt-3">
  <div class="text-muted small">
    @if (totalCount() === 0) {
      No results
    } @else {
      Showing {{ rangeStart() }}–{{ rangeEnd() }} of {{ totalCount() }}
    }
  </div>
  <div class="d-flex align-items-center gap-2">
    <label class="small text-muted mb-0">Rows per page</label>
    <select class="form-select form-select-sm" style="width: auto;" (change)="onPageSizeChange($event)">
      @for (size of pageSizeOptions(); track size) {
        <option [value]="size" [selected]="size === pageSize()">{{ size }}</option>
      }
    </select>
    <div class="btn-group btn-group-sm" role="group">
      <button type="button" class="btn btn-outline-secondary" [disabled]="!hasPrevious()" (click)="previous()">
        <i class="bi bi-chevron-left"></i> Prev
      </button>
      <button type="button" class="btn btn-outline-secondary" disabled>Page {{ page() }} of {{ totalPages() }}</button>
      <button type="button" class="btn btn-outline-secondary" [disabled]="!hasNext()" (click)="next()">
        Next <i class="bi bi-chevron-right"></i>
      </button>
    </div>
  </div>
</div>
