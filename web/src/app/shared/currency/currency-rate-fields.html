<div class="row g-3">
  <div class="col-12 col-sm-6">
    <label class="form-label small fw-semibold" for="currencyCode">Currency</label>
    <select
      id="currencyCode"
      class="form-select"
      [disabled]="disabled()"
      (change)="onCurrencyChange($any($event.target).value)"
    >
      @for (option of options(); track option.code) {
        <option [value]="option.code" [selected]="currencyCode() === option.code">
          {{ option.code }} — {{ option.name }}
        </option>
      }
    </select>
  </div>
  <div class="col-12 col-sm-6">
    <label class="form-label small fw-semibold" for="exchangeRate">
      {{ rateLabel() }} <span class="text-danger">*</span>
    </label>
    <input
      id="exchangeRate"
      type="number"
      class="form-control"
      min="0"
      step="0.000001"
      placeholder="Exchange Rate"
      [value]="exchangeRate()"
      [disabled]="disabled() || isBaseCurrency()"
      (change)="onRateChange($event)"
    />
    @if (isBaseCurrency()) {
      <div class="form-text small">
        A document in {{ baseCurrencyCode }} always has a rate of 1.
      </div>
    }
  </div>
</div>
