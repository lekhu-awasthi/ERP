@if (documentId(); as docId) {
  <div class="card border-0 shadow-sm mb-4">
    <div class="card-body p-2">
      <ul class="nav nav-pills gap-1" role="tablist">
        @for (tab of tabs; track tab) {
          <li class="nav-item" role="presentation">
            <button
              type="button"
              class="nav-link"
              [class.active]="activeTab() === tab"
              [attr.aria-selected]="activeTab() === tab"
              role="tab"
              (click)="switchTab(tab)"
            >
              {{ tab }}
            </button>
          </li>
        }
      </ul>
    </div>
  </div>

  @if (parent(); as tabParent) {
    @if (activeTab() === 'Tasks') {
      <div class="card border-0 shadow-sm mb-4">
        <div class="card-body p-4">
          <h6 class="fw-bold text-dark mb-3">Tasks</h6>
          <app-task-list [organizationId]="organizationId()" [parentType]="taskParentType()" [parentId]="docId" />
        </div>
      </div>
    }

    @if (activeTab() === 'Documents') {
      <div class="card border-0 shadow-sm mb-4">
        <div class="card-body p-4">
          <h6 class="fw-bold text-dark mb-3">Documents</h6>
          <app-attachment-list [organizationId]="organizationId()" [parent]="tabParent" />
        </div>
      </div>
    }

    @if (activeTab() === 'Activity') {
      <div class="card border-0 shadow-sm mb-4">
        <div class="card-body p-4">
          <h6 class="fw-bold text-dark mb-3">Activity</h6>
          <app-activity-panel [organizationId]="organizationId()" [parent]="tabParent" />
        </div>
      </div>
    }
  }
}
