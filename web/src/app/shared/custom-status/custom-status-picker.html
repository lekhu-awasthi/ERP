<!-- Phase 45 fixed this control navigating the page: it renders in a document-list row, and the row
     was one `<a [routerLink]>` with the select inside it, so the handlers here had to stop
     propagation AND prevent the default (stopping propagation alone suppressed RouterLink's own
     listener, the one that calls preventDefault, leaving native anchor navigation as the only
     behaviour).

     Phase 47 removed the cause instead of guarding the symptom. A control nested in a link is
     invalid HTML that no handler makes valid -- the select is inside the link's accessible name,
     and a keyboard user who tabs onto it is standing inside a link. The four rows are now a `<div>`
     with a `stretched-link` on the document code, so this control is a sibling of the link rather
     than a child of it, and there is nothing left to swallow. `a11y-sweep-guard.spec.ts` asserts no
     template nests an interactive control in a link or button, which is a stronger guarantee than
     one component defending itself. -->
<select aria-label="Custom status"
  class="form-select form-select-sm"
  style="width: auto;"
  [disabled]="saving()"
  (change)="onChange($event)"
>
  <option value="" [selected]="customStatusId() === null">Select Status</option>
  @for (option of options(); track option.id) {
    <option [value]="option.id" [selected]="option.id === customStatusId()">{{ option.name }}</option>
  }
</select>
