name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  dotnet:
    name: .NET build & test
    runs-on: ubuntu-latest
    env:
      # Throwaway password for a container that only lives for this one CI run —
      # not a real secret, so no need to route it through GitHub Actions secrets.
      CI_SQL_SA_PASSWORD: "P@ssw0rd_CI_Only_2026!"
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "P@ssw0rd_CI_Only_2026!"
        ports:
          - 1433:1433
        options: >-
          --health-cmd="/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P P@ssw0rd_CI_Only_2026! -Q 'SELECT 1'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore ErpApp.slnx

      - name: Build
        run: dotnet build ErpApp.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test ErpApp.slnx --no-build --configuration Release --logger "trx;LogFileName=test-results.trx"
        env:
          ConnectionStrings__Default: "Server=localhost,1433;Database=ErpApp;User Id=sa;Password=${{ env.CI_SQL_SA_PASSWORD }};TrustServerCertificate=True"
          # Every option registered with ValidateOnStart must resolve or WebApplicationFactory
          # throws before a single integration test runs. The four host-booting suites each supply
          # these in their own AddInMemoryCollection, which is the load-bearing fix and the reason
          # CI is green; these are belt-and-braces so a new suite that forgets one fails on its own
          # assertion rather than on an opaque startup error. Not secrets: the Turnstile value is
          # Cloudflare's documented always-passes dummy key, and no test registers a user or
          # issues a token.
          Jwt__SigningKey: "integration-test-signing-key-not-for-real-use"
          Email__From: "test@example.com"
          Email__SmtpServer: "localhost"
          Email__Port: "25"
          Email__Username: "test"
          Email__Password: "test"
          Turnstile__SecretKey: "1x0000000000000000000000000000000AA"

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-results
          path: "**/TestResults/*.trx"

  angular:
    name: Angular build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint / build
        run: npm run build -- --configuration production

      - name: Test
        run: npm test -- --watch=false